# QG-10 — the PR title follows Conventional Commits (it becomes the squash
# commit message).
#
# Kept out of the CI workflow so that editing a title reruns only this check
# instead of cancelling and redoing the whole build. The job `name:` is a
# required status check on `main`.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
