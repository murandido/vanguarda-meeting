# Project quality gates (QG-01 .. QG-09; QG-10 lives in pr-title.yml and
# QG-11 in bench.yml).
#
# Layout (each heavy job compiles the workspace exactly once):
#
#   changes ─┬─ rust   fmt → clippy (native + wasm32) → sqlx → llvm-cov nextest
#            │         (tests and coverage in a single pass) → doctests
#            └─ web    wasm-pack + size budget → server build → Playwright
#   gates (matrix)     one lightweight job per gate, named after its status check
#   deny               cargo-deny (no compilation; always runs)
#
# The required status checks on `main` are the `gates` matrix job names (fmt,
# clippy, test, sqlx, coverage, wasm, e2e), plus `deny` and `pr-title`. Do NOT
# rename them without updating the branch protection rules. A job skipped by
# `if:` counts as passing for branch protection, so the gates always run
# (`!cancelled()`) and fail explicitly when the heavy job failed.
#
# Docs-only PRs skip compilation: `changes` decides and the gates pass without
# running anything. On `main` everything always runs (coverage baseline and the
# `canvas-pkg` artifact used by the deploy).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs of the same PR. Runs on `main` are never cancelled,
# so every push records its coverage baseline (QG-09) and gets deployed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # sqlx `query!` macros read the metadata committed in `.sqlx/`.
  SQLX_OFFLINE: true
  # Only `main` writes build caches: PRs restore from it instead of competing
  # for the repository's 10 GB of cache storage.
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # Decides whether the PR touches anything besides documentation.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE*'

  # QG-01..QG-05 and QG-09 in a single job sharing one toolchain and cache.
  # Every gate runs even if an earlier one failed (`!cancelled()`), so a PR
  # shows all problems at once; each outcome goes to `outputs` and is
  # published by the `gates` job.
  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    outputs:
      fmt: ${{ steps.fmt.outcome }}
      clippy: ${{ steps.clippy.outcome == 'success' && steps.clippy_wasm.outcome == 'success' && 'success' || 'failure' }}
      sqlx: ${{ steps.sqlx.outcome }}
      test: ${{ steps.cov.outcome == 'success' && steps.doctests.outcome == 'success' && 'success' || 'failure' }}
      coverage: ${{ steps.cov.outcome == 'success' && steps.cov_gate.outcome != 'failure' && 'success' || 'failure' }}
    env:
      COVERAGE_TOLERANCE: "0.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ env.SAVE_CACHE }}
      # Prebuilt binaries. sqlx-cli has no release binaries of its own; the
      # install-action falls back to cargo-binstall, which fetches it from
      # quickinstall.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest,cargo-llvm-cov,sqlx-cli

      # QG-01 — formatting.
      - id: fmt
        name: fmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check

      # QG-02 — lints (native, plus wasm32 for the canvas crate).
      - id: clippy
        name: clippy (workspace, native)
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - id: clippy_wasm
        name: clippy (canvas, wasm32)
        if: ${{ !cancelled() }}
        run: cargo clippy -p canvas --target wasm32-unknown-unknown -- -D warnings

      # QG-05 — the offline metadata in `.sqlx/` must match the queries.
      # Reuses the dependency `check` artifacts built by clippy.
      - id: sqlx
        name: sqlx prepare --check
        if: ${{ !cancelled() }}
        env:
          # `prepare` needs a real database to validate the queries.
          SQLX_OFFLINE: false
          DATABASE_URL: sqlite://${{ github.workspace }}/target/sqlx-check.db
        run: |
          mkdir -p target
          rm -f target/sqlx-check.db
          sqlx database create
          sqlx migrate run --source crates/server/migrations
          cargo sqlx prepare --workspace --check

      # QG-03/QG-04 + QG-09 — unit, integration and property tests (proptest
      # convergence in crates/canvas/tests), instrumented: one nextest run
      # yields both the test results and the coverage report.
      - id: cov
        name: tests (nextest) + coverage
        if: ${{ !cancelled() }}
        run: |
          cargo llvm-cov nextest --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only --json --output-path coverage.json
          pct="$(jq -r '.data[0].totals.lines.percent' coverage.json)"
          printf '%.2f\n' "$pct" > coverage-pct.txt
          echo "Line coverage: $(cat coverage-pct.txt)%"

      # nextest does not run doctests.
      - id: doctests
        name: doctests
        if: ${{ !cancelled() }}
        run: cargo test --doc --workspace

      # --- QG-09, push to main: store the baseline ---
      #
      # The baseline lives in actions/cache: PRs can read caches created on the
      # base branch without an extra token. Every push to main saves a unique
      # key (`coverage-main-<run_id>`; caches are immutable) and PRs restore by
      # the `coverage-main-` prefix, which returns the newest entry. Caches
      # unused for 7 days are evicted; the PR then passes with a notice until
      # the next push to main.
      - name: prepare baseline
        if: ${{ !cancelled() && steps.cov.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p .coverage-baseline
          cp coverage-pct.txt .coverage-baseline/coverage-main.txt
      - name: save baseline
        if: ${{ !cancelled() && steps.cov.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .coverage-baseline
          key: coverage-main-${{ github.run_id }}

      # --- QG-09, PR: compare against the main baseline ---
      - name: restore main baseline
        if: ${{ !cancelled() && steps.cov.outcome == 'success' && github.event_name == 'pull_request' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .coverage-baseline
          # Deliberately missing key: forces restore-keys (newest entry).
          key: coverage-main-restore-${{ github.run_id }}
          restore-keys: coverage-main-
      - id: cov_gate
        name: compare coverage with baseline
        if: ${{ !cancelled() && steps.cov.outcome == 'success' && github.event_name == 'pull_request' }}
        run: |
          pr="$(cat coverage-pct.txt)"
          base_file=.coverage-baseline/coverage-main.txt
          {
            echo "## Coverage (QG-09)"
            echo
            echo "| | Lines |"
            echo "|---|---|"
            echo "| PR | ${pr}% |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ ! -f "$base_file" ]]; then
            echo "| main | (no baseline) |" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Coverage::No main baseline yet; gate skipped for this run."
            exit 0
          fi

          base="$(cat "$base_file")"
          min="$(awk -v b="$base" -v t="$COVERAGE_TOLERANCE" 'BEGIN { printf "%.2f", b - t }')"
          {
            echo "| main | ${base}% |"
            echo "| minimum | ${min}% (tolerance ${COVERAGE_TOLERANCE} pp) |"
          } >> "$GITHUB_STEP_SUMMARY"

          if awk -v p="$pr" -v m="$min" 'BEGIN { exit !(p < m) }'; then
            echo "::error title=Coverage::PR coverage (${pr}%) is below main (${base}%) minus the tolerance (${COVERAGE_TOLERANCE})."
            exit 1
          fi
          echo "Coverage OK: PR ${pr}% >= minimum ${min}%."
      - name: coverage summary (main)
        if: ${{ !cancelled() && steps.cov.outcome == 'success' && github.event_name != 'pull_request' }}
        run: |
          {
            echo "## Coverage (QG-09)"
            echo
            echo "Lines: $(cat coverage-pct.txt)%"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && steps.cov.outcome == 'success' }}
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 7

  # QG-07 + QG-08 — wasm build (with size budget) and Playwright E2E in one
  # job: the pkg is built once and served by the dev server. Playwright's
  # webServer starts the server itself (`cargo run -p server`); building it
  # first just keeps compilation out of Playwright's startup timeout.
  web:
    name: web
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    outputs:
      wasm: ${{ steps.wasm_build.outcome == 'success' && steps.wasm_size.outcome == 'success' && 'success' || 'failure' }}
      e2e: ${{ steps.e2e.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ env.SAVE_CACHE }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: wasm-pack

      # QG-07 — wasm build and size budget.
      - id: wasm_build
        name: wasm-pack build
        run: wasm-pack build crates/canvas --target web --release
      - id: wasm_size
        name: size budget (gzip)
        run: scripts/check-wasm-size.sh crates/canvas/pkg/canvas_bg.wasm
      # Consumed by deploy.yml (the same pkg that passed E2E).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canvas-pkg
          path: crates/canvas/pkg
          if-no-files-found: error
          retention-days: 7

      # QG-08 — E2E. Requires the wasm build above to have passed.
      - name: build server
        run: cargo build -p server
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: npm ci
        working-directory: e2e
        run: npm ci
      # Playwright browsers are cached (version pinned by package-lock). On a
      # cache hit we skip `--with-deps`: Chromium's system libraries already
      # ship with the runner image (it includes Google Chrome), and apt-get
      # would cost ~12 s per run. On a miss, install everything.
      - id: pw_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: install Chromium (headless shell)
        if: steps.pw_cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps --only-shell chromium
      - id: e2e
        name: playwright
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # QG-06 — advisories, licenses, bans and sources (see deny.toml). Compiles
  # nothing and takes seconds, so it always runs (docs-only PRs included).
  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny
      - run: cargo deny check

  # Publishes one status check per gate, under the name branch protection
  # requires. Passes if the gate passed in its heavy job, or if the PR is
  # docs-only (heavy jobs skipped on purpose).
  gates:
    name: ${{ matrix.gate }}
    needs: [changes, rust, web]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        gate: [fmt, clippy, test, sqlx, coverage, wasm, e2e]
    steps:
      - name: result
        env:
          GATE: ${{ matrix.gate }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          OUTCOME: ${{ needs.rust.outputs[matrix.gate] || needs.web.outputs[matrix.gate] }}
        run: |
          if [[ "$CHANGES" != success ]]; then
            echo "::error title=$GATE::the 'changes' job ended with '$CHANGES'."
            exit 1
          fi
          if [[ "$CODE" != true ]]; then
            echo "Docs-only change; $GATE does not need to run."
            exit 0
          fi
          if [[ "$OUTCOME" != success ]]; then
            echo "::error title=$GATE::gate '$GATE' failed (outcome: '${OUTCOME:-missing}'); see the 'rust' or 'web' job."
            exit 1
          fi
          echo "$GATE: ok"
