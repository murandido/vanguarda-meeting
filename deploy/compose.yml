# Stack de produção do Vanguarda na VPS. Fica em /opt/vanguarda junto com o
# .env (segredos, permissão 600) e é atualizado pelo deploy/deploy.sh.
#
# Compose also reads /opt/vanguarda/.env for interpolation: PROXY_NETWORK
# names the existing Docker network shared with the Caddy reverse proxy.
name: vanguarda

services:
  app:
    image: ghcr.io/murandido/vanguarda-meeting:${IMAGE_TAG:?defina IMAGE_TAG}
    # The reverse proxy reaches the app by this name on the proxy network.
    container_name: vanguarda-meeting
    env_file: .env
    environment:
      BIND: 0.0.0.0:3000
    volumes:
      - ./data:/data
    # Hardening: read-only root (only the /data mount and /tmp are writable;
    # SQLite in WAL mode keeps -wal/-shm next to the database in /data), no
    # capabilities, no privilege escalation and a process limit.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    networks: [proxy]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/server", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

networks:
  proxy:
    name: ${PROXY_NETWORK:?set PROXY_NETWORK in /opt/vanguarda/.env}
    external: true
